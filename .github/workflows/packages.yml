# Checks for the shared packages (packages/ui, packages/shared). Every app's
# workflow also runs when these change, so a break shows up in the apps too.
name: packages

on:
  push:
    branches: [main]
    paths: ["packages/**", "package.json", "package-lock.json", ".github/workflows/packages.yml"]
  pull_request:
    paths: ["packages/**", "package.json", "package-lock.json", ".github/workflows/packages.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w packages/shared -w packages/ui
      - run: npm run test -w packages/shared -w packages/ui --if-present
