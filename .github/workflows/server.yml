# Checks for the server (apps/server). Same flow as client.yml's check job.
# No Worker Preview job yet: the server needs its secrets and the Atlas cluster first.
# TODO(I2, I4): add a preview job like client.yml's once they exist.
name: server

on:
  push:
    branches: [main]
    paths: ["apps/server/**", "packages/shared/**", "package.json", "package-lock.json", ".github/workflows/server.yml"]
  pull_request:
    paths: ["apps/server/**", "packages/shared/**", "package.json", "package-lock.json", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/server
      - run: npm run test -w apps/server
      # The Worker bundle, as `wrangler deploy` builds it, without deploying
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: apps/server
