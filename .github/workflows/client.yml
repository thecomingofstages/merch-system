# Checks for the client (apps/client), and a Worker Preview for each pull request.
# Same flow as the portfolio website's client.yml, run from the npm workspace root.
# Production deploys: Cloudflare Workers Builds (Git integration), set up in the
# Cloudflare dashboard (task I4).
name: client

on:
  push:
    branches: [main]
    paths: ["apps/client/**", "packages/**", "package.json", "package-lock.json", ".github/workflows/client.yml"]
  pull_request:
    paths: ["apps/client/**", "packages/**", "package.json", "package-lock.json", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/client
      - run: npm run typecheck -w apps/client
      - run: npm run test -w apps/client --if-present
      # The Workers build (next build + OpenNext bundle), as Cloudflare runs it.
      # next build type-checks again, with the route types it generates.
      - run: npx opennextjs-cloudflare build
        working-directory: apps/client

  # A Worker Preview per pull request (`wrangler preview`), named after the PR branch.
  # Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (task I4).
  # Skipped for pull requests from forks, which get no secrets.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Shows a "View deployment" button on the pull request, linked to the Preview URL.
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    concurrency:
      group: preview-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx opennextjs-cloudflare build
        working-directory: apps/client
      - name: wrangler preview
        id: preview
        working-directory: apps/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The checkout is a merge commit, not the branch, so pass the name.
          BRANCH: ${{ github.head_ref }}
        run: |
          npx wrangler preview --name "$BRANCH" | tee preview.log
          grep -E '^(Preview URL|Unique Deployment URL):' preview.log >> "$GITHUB_STEP_SUMMARY"
          echo "url=$(sed -n 's/^Preview URL: //p' preview.log)" >> "$GITHUB_OUTPUT"
